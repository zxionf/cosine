name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  SLANG_VERSION: "2026.17.1"

jobs:
  linux:
    name: Linux (GCC, lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            libvulkan-dev vulkan-tools glslc mesa-vulkan-drivers \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            xvfb

      - name: Install Slang
        run: |
          # 归档布局在不同版本间可能变化（顶层目录 or 直接 bin/），
          # 解压后用 find 定位 slangc，避免 strip-components 猜错层级。
          curl -fsSL -o slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz"
          mkdir -p "${HOME}/tools/slang"
          tar -xzf slang.tar.gz -C "${HOME}/tools/slang"
          SLANGC="$(find "${HOME}/tools/slang" -maxdepth 4 -type f -name slangc | head -n 1)"
          if [ -z "$SLANGC" ]; then
            echo "slangc not found; archive layout:"
            find "${HOME}/tools/slang" -maxdepth 3 | head -n 50
            exit 1
          fi
          chmod +x "$SLANGC"
          "$SLANGC" -v
          echo "SLANGC_EXECUTABLE=${SLANGC}" >> "$GITHUB_ENV"

      - name: Ensure CMake >= 4
        env:
          CMAKE_VERSION: "4.4.4"
        run: |
          # 项目 cmake_minimum_required(VERSION 4.0.0)；runner 自带的 CMake 可能更旧。
          major="$(cmake --version | head -n 1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          if [ "${major:-0}" -ge 4 ]; then
            echo "preinstalled CMake satisfies >= 4"
            cmake --version | head -n 1
            exit 0
          fi
          curl -fsSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          sudo tar -xzf cmake.tar.gz -C /opt
          for tool in cmake ctest cpack; do
            sudo ln -sf "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/${tool}" "/usr/local/bin/${tool}"
          done
          hash -r
          cmake --version | head -n 1
      - name: Toolchain versions
        run: |
          cmake --version
          ninja --version
          g++ --version | head -n 1

      - name: Configure and build
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCOSINE_GLFW_WAYLAND=OFF \
            -DCOSINE_GLFW_X11=ON \
            -DSLANGC_EXECUTABLE="$SLANGC_EXECUTABLE" \
            -DVulkan_GLSLC_EXECUTABLE=/usr/bin/glslc
          cmake --build build-ci -j2

      - name: Unit tests
        run: ctest --test-dir build-ci --output-on-failure

      - name: AddressSanitizer tests
        env:
          COSINE_BUILD_DIR: ${{ github.workspace }}/build-asan
          COSINE_JOBS: "2"
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCOSINE_GLFW_WAYLAND=OFF \
            -DCOSINE_GLFW_X11=ON \
            -DCOSINE_SANITIZE=address \
            -DSLANGC_EXECUTABLE="$SLANGC_EXECUTABLE" \
            -DVulkan_GLSLC_EXECUTABLE=/usr/bin/glslc
          cmake --build build-asan -j2
          ctest --test-dir build-asan --output-on-failure

      - name: lavapipe smoke
        env:
          COSINE_BUILD_DIR: ${{ github.workspace }}/build-ci
          COSINE_SMOKE_SECONDS: "10"
        run: xvfb-run -a ./scripts/smoke-lavapipe.sh

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        run: choco install vulkan-sdk -y --no-progress

      - name: Locate Vulkan SDK
        shell: pwsh
        run: |
          # choco 安装后当前会话不一定有新环境变量，显式从默认安装目录解析。
          $sdk = $env:VULKAN_SDK
          if (-not $sdk -or -not (Test-Path $sdk)) {
            $dir = Get-ChildItem 'C:\VulkanSDK' -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
            if ($dir) { $sdk = $dir.FullName }
          }
          if (-not $sdk) { throw "Vulkan SDK not found" }
          Write-Host "VULKAN_SDK=$sdk"
          "VULKAN_SDK=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Install Slang
        shell: pwsh
        run: |
          $url = "https://github.com/shader-slang/slang/releases/download/v${env:SLANG_VERSION}/slang-${env:SLANG_VERSION}-windows-x86_64.zip"
          Invoke-WebRequest -Uri $url -OutFile slang.zip
          Expand-Archive -Path slang.zip -DestinationPath slang -Force
          $slangc = Get-ChildItem -Path slang -Filter slangc.exe -Recurse | Select-Object -First 1
          if (-not $slangc) { throw "slangc.exe not found in archive" }
          Write-Host "slangc: $($slangc.FullName)"
          "SLANGC_EXECUTABLE=$($slangc.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Ensure CMake >= 4
        env:
          CMAKE_VERSION: "4.4.4"
        run: |
          # 项目 cmake_minimum_required(VERSION 4.0.0)；runner 自带的 CMake 可能更旧。
          major="$(cmake --version | head -n 1 | sed -E 's/.*version ([0-9]+).*/\1/')"
          if [ "${major:-0}" -ge 4 ]; then
            echo "preinstalled CMake satisfies >= 4"
            cmake --version | head -n 1
            exit 0
          fi
          curl -fsSL -o cmake.tar.gz \
            "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          sudo tar -xzf cmake.tar.gz -C /opt
          for tool in cmake ctest cpack; do
            sudo ln -sf "/opt/cmake-${CMAKE_VERSION}-linux-x86_64/bin/${tool}" "/usr/local/bin/${tool}"
          done
          hash -r
          cmake --version | head -n 1
      - name: Toolchain versions
        shell: pwsh
        run: |
          cmake --version
          ninja --version

      - name: Configure and build
        shell: pwsh
        run: |
          cmake -S . -B build-ci -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DSLANGC_EXECUTABLE="$env:SLANGC_EXECUTABLE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-ci --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Unit tests
        shell: pwsh
        run: |
          ctest --test-dir build-ci --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
